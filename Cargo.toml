[package]
name = "agent-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.18"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dependencies.tiktoken-rs]
version = "0.5"
optional = true

[dependencies.async-openai]
version = "0.26"
optional = true

[dependencies.criterion]
version = "0.5"
optional = true

[features]
default = ["openai", "builtin-tools"]
openai = ["dep:async-openai"]
anthropic = []
local-llm = []
builtin-tools = []
mcp = []
codex-compat = ["dep:tiktoken-rs"]

[[bench]]
name = "token_bench"
harness = false
optional = true